<html lang="en">
<head>

<meta charset="UTF-8">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Our Work | Elite Roofing & Chimney Services</title>

<link rel="stylesheet" href="style.css">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/glightbox/dist/css/glightbox.min.css">

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f5f5f5;
}

.page-header{
    text-align:center;
    padding:50px 20px;
    background:#111;
    color:#fff;
}

.page-header h1{
    margin:0;
    font-size:40px;
}

.page-header p{
    color:#ddd;
    margin-top:10px;
}

.btn{
    display:inline-block;
    margin-top:20px;
    padding:12px 28px;
    background:#d4af37;
    color:#000;
    text-decoration:none;
    border-radius:6px;
    font-weight:bold;
}

.gallery{
    padding:40px 20px;
}

.gallery-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
    gap:20px;
}

.gallery-item{
    overflow:hidden;
    border-radius:10px;
    background:#fff;
    box-shadow:0 5px 15px rgba(0,0,0,.15);
}

.gallery-item img{
    width:100%;
    height:260px;
    object-fit:cover;
    display:block;
    transition:.3s;
}

.gallery-item img:hover{
    transform:scale(1.05);
}

.load-more{
    text-align:center;
    padding:40px;
}
</style>

</head>

<body>

<header class="page-header">
<h1>Our Work</h1>

<p>Take a look at our completed roofing & chimney projects across Ireland.</p>

<a href="index.html" class="btn">← Back Home</a>

</header>

<section class="gallery">

<div class="gallery-grid" id="gallery"></div>

<div class="load-more">
<button id="loadMore" class="btn">Load More Projects</button>
</div>

</section>

<script>
const gallery=document.getElementById("gallery");

const totalImages=84;
const imagesPerLoad=12;

let currentImage=1;

function loadImages(){

let end=Math.min(currentImage+imagesPerLoad-1,totalImages);

for(let i=currentImage;i<=end;i++){

gallery.innerHTML+=`
<div class="gallery-item">

<a href="images/work/${i}.webp"
class="glightbox"
data-gallery="roof">

<img src="images/work/${i}.webp"
alt="Project ${i}"
loading="lazy">

</a>

</div>
`;

}

currentImage=end+1;

GLightbox({
    selector: ".glightbox"
});
if(currentImage>totalImages){
document.getElementById("loadMore").style.display="none";
}

}

loadImages();

document.getElementById("loadMore").onclick=loadImages;
</script>

<script src="https://cdn.jsdelivr.net/npm/glightbox/dist/js/glightbox.min.js"></script>

<script>
let lightbox = GLightbox({
    selector: ".glightbox",
    loop: true,
    touchNavigation: true
});

loadImages();

document.getElementById("loadMore").onclick = function () {
    loadImages();
    lightbox.destroy();
    lightbox = GLightbox({
        selector: ".glightbox",
        loop: true,
        touchNavigation: true
    });
};
</script>

</body>
</html>
